name: Deploy to GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and pushs
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nolifekntb/dockerized-service:latest
            ghcr.io/nolifekntb/dockerized-service:${{ github.sha }}
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/dockerNodeDeploy
            export CR_PAT=${{ secrets.GHCR_TOKEN }}
            echo $CR_PAT | docker login ghcr.io -u NolifekNTB --password-stdin
            sudo docker pull ghcr.io/nolifekntb/dockerized-service:latest
            sudo docker run -d \
              -p 3000:3000 \
              --env-file .env \
              ghcr.io/nolifekntb/dockerized-service:latest
            
    
    
